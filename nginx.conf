worker_processes auto;
pid /tmp/atlas-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/atlas-body;
    proxy_temp_path /tmp/atlas-proxy;
    fastcgi_temp_path /tmp/atlas-fastcgi;
    uwsgi_temp_path /tmp/atlas-uwsgi;
    scgi_temp_path /tmp/atlas-scgi;
    sendfile on;
    server {
        listen 8080;
        server_name _;
        root /srv/atlas;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }
}
